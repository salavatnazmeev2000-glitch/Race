<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Гонка по трассе</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b1020">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#0b1020;--ui:rgba(18,24,34,.55);--tx:#fff;--hot:#ff5a36;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--tx);touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#cv{position:fixed;inset:0;width:100%;height:100%}
.hide{display:none!important}
#hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;padding:calc(10px + env(safe-area-inset-top,0px)) 14px 0;pointer-events:none;text-shadow:0 1px 5px rgba(0,0,0,.6)}
#sp{font-size:46px;line-height:1;font-weight:800}
.bar{width:130px;height:6px;margin-top:6px;border-radius:3px;background:rgba(255,255,255,.3)}
.bar i{display:block;height:100%;width:0;border-radius:3px;background:var(--hot)}
.r{text-align:right;font-size:15px;line-height:1.4}
#pause{position:fixed;top:calc(10px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);height:40px;min-width:44px;font-size:18px;padding:0 12px}
#cdn{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:120px;font-weight:900;pointer-events:none;text-shadow:0 0 20px #000}
#tip{position:fixed;left:0;right:0;top:30%;text-align:center;font-size:15px;line-height:1.5;padding:0 24px;pointer-events:none;text-shadow:0 1px 5px #000}
#pad{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 14px calc(14px + env(safe-area-inset-bottom,0px));pointer-events:none}
.g{display:flex;gap:10px;pointer-events:auto;align-items:flex-end}
.c{flex-direction:column;align-items:stretch}
.row{display:flex;gap:10px}
.row button{flex:1}
button{border:0;border-radius:18px;background:var(--ui);color:var(--tx);font:700 15px system-ui,sans-serif;height:58px;min-width:58px;padding:0 14px;touch-action:none;-webkit-tap-highlight-color:transparent}
button.on{background:var(--hot)}
.s{width:76px;height:76px;font-size:26px}
.gas{height:76px;font-size:19px}
#wl{position:static;width:150px;height:150px;touch-action:none}
#menu{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:linear-gradient(transparent 30%,rgba(10,0,25,.65))}
.col{display:flex;flex-direction:column;align-items:center;gap:14px;padding:20px}
.col h1{margin:0 0 8px;font-size:34px;font-weight:900;letter-spacing:1px;text-align:center;text-shadow:0 0 10px #ff3dcc,0 0 24px #ff3dcc}
.col button{width:min(260px,80vw);height:60px;font-size:18px;background:rgba(255,255,255,.2)}
.col button.pri{background:var(--hot)}
.col input{width:min(260px,80vw);accent-color:var(--hot)}
.bal{font-size:18px;font-weight:700;text-shadow:0 1px 6px #000}
#shop{max-height:92vh;overflow-y:auto}
#shop .it{display:flex;align-items:center;gap:12px;width:min(340px,86vw);background:rgba(255,255,255,.14);border-radius:16px;padding:8px}
#shop canvas{position:static;width:96px;height:64px;flex:none}
#shop .inf{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:15px;overflow-wrap:anywhere}
#shop button{width:auto;height:auto;min-height:44px;max-width:112px;min-width:0;font-size:13px;line-height:1.2;padding:6px 8px;background:var(--hot);white-space:normal;text-align:center;flex:none}
#shop button:disabled{background:rgba(255,255,255,.2);color:#ddd}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:min(330px,90vw)}.grid button{width:auto;height:54px;font-size:17px;padding:0}.grid button:disabled{opacity:.5}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hide">
  <div><span id="sp">0</span> <small>км/ч</small><div class="bar"><i id="bar"></i></div></div>
  <div class="r"><span id="l1"></span><br><span id="l2"></span><br><small id="l3"></small><br>🪙 <b id="cn">0</b>/20</div>
</div>
<button id="pause" class="hide">⏸</button>
<div id="cdn" class="hide"></div>

<div id="pad" class="hide">
  <div id="lft" class="g"><div id="arr" class="g"><button class="s" data-k="l">◀</button><button class="s" data-k="r">▶</button></div><canvas id="wl" width="300" height="300" class="hide"></canvas></div>
  <div class="g c"><button class="gas" data-k="g">Газ</button><div class="row"><button data-k="b">Тормоз</button><button data-k="h">Ручник</button></div></div>
</div>
<div id="menu">
  <div id="mm" class="col">
    <h1>Гонка по трассе</h1>
    <div class="bal">🪙 <b id="bal">0</b></div>
    <button id="play" class="pri">Играть</button>
    <button id="cont" class="hide">Продолжить</button>
    <button data-p="dif">Гонка с ботом</button>
    <button id="surv">Выживание</button>
    <button data-p="chp">Главы</button>
    <button data-p="shop">Магазин</button>
    <button data-p="sm">Настройки</button>
  </div>
  <div id="dif" class="col hide">
    <h1 style="font-size:26px">Гонка с ботом</h1>
    <button class="pri" data-d="0">Лёгкий · 10 🪙</button>
    <button class="pri" data-d="1">Средний · 20 🪙</button>
    <button class="pri" data-d="2">Сложный · 25 🪙</button>
    <button data-p="mm">Назад</button>
  </div>
  <div id="chp" class="col hide">
    <h1 style="font-size:26px">Главы</h1>
    <button class="pri" data-ch="1"></button>
    <button class="pri" data-ch="2"></button>
    <button data-p="mm">Назад</button>
  </div>
  <div id="lvl" class="col hide">
    <h1 id="lvt" style="font-size:24px"></h1>
    <div id="lvg" class="grid"></div>
    <button data-p="chp">Назад</button>
  </div>
  <div id="res" class="col hide">
    <h1 id="rh" style="font-size:30px"></h1>
    <div id="rt"></div>
    <button class="pri hide" id="nxt">Дальше</button>
    <button class="pri" id="again">Ещё раз</button>
    <button data-p="mm">В меню</button>
  </div>
  <div id="sm" class="col hide">
    <h1 style="font-size:26px">Настройки</h1>
    <div>Музыка: <b id="mvv"></b></div>
    <input type="range" id="mv" min="0" max="100" step="5">
    <button id="ctl"></button>
    <button id="skb"></button>
    <button id="wxb"></button>
    <button id="dmb"></button>
    <button data-p="mm">Назад</button>
  </div>
  <div id="shop" class="col hide">
    <h1 style="font-size:26px">Магазин</h1>
    <div class="bal">🪙 <b id="bal2">0</b></div>
    <div id="shopList" class="col"></div>
    <button data-p="mm">Назад</button>
  </div>
</div>
<script>
const cv=document.getElementById('cv'),C=cv.getContext('2d'),$=id=>document.getElementById(id);
let G=C,W,H;
function rs(){const d=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*d|0;H=cv.height=innerHeight*d|0}
addEventListener('resize',rs);rs();
const SEG=200,RW=1312,CH=1000,CD=.84,ZC=1312,D=160,MAXV=12000,CAMH=2.2,CAMZ=8,wind=60;
const TP=[212,114,240,112,280,110,320,108,355,106,395,100,425,96,457,95,478,101,490,112,498,127,500,140,490,147,470,150,440,152,410,154,385,152,370,146,355,137,338,126,322,118,305,120,298,128,300,140,290,150,270,160,255,172,250,190,255,208,265,226,275,236,262,236,245,230,228,220,205,210,185,200,165,180,150,165,130,160,118,170,116,190,95,205,60,190,40,175,42,155,62,140,100,125,150,118,180,116];
const VEH={car:{n:'Машина',vmax:220,price:0,acc:1,steer:1,roll:1,c:'#e53935'},moto:{n:'Мотоцикл',vmax:250,price:50,acc:1.25,steer:1.3,roll:2.2,c:'#00b4d8'},f1:{n:'Формула 1',vmax:280,price:150,acc:1.35,steer:1.1,roll:.6,c:'#e10600'},lamb:{n:'Ламборгини-300',vmax:290,price:300,acc:1.3,steer:1.1,roll:.9,c:'#ff7a00'},pors:{n:'Порше',vmax:300,price:500,acc:1.3,steer:1.15,roll:1,c:'#1faa4b'},ferr:{n:'Феррари',vmax:305,price:800,acc:1.35,steer:1.15,roll:.9,c:'#d40000'}};
const DIFF=[{n:'Лёгкий',r:10,sk:.9,A:3,lt:.9,nz:.22,vm:.98,c:'#27ae60'},{n:'Средний',r:20,sk:.96,A:3.6,lt:1.2,nz:.08,vm:1.04,c:'#f2c94c'},{n:'Сложный',r:25,sk:1,A:4.4,lt:1.5,nz:.02,vm:1.1,c:'#9b51e0'}];
let wallet=0,own={car:1},sel='car',mv=50,ctl=0,sky='night',svBest=0,sv=0,svPaid=0,svCoins=0,paused=false,wx=0,lz=3,lf=0,bolts=[],RD=[],spl=0,dm=0,lvx=0,bt=0,cCh=1,cLv=1,pg=[0,0];
try{const s=JSON.parse(localStorage.getItem('race_save')||'null');if(s){wallet=s.w|0;own=s.own||own;sel=s.sel||sel;mv=s.mv??mv;ctl=s.ctl|0;sky=s.sky||sky;svBest=s.sb||0;wx=s.wx|0;dm=s.dm|0;if(s.pg)pg=s.pg}}catch(_){}
const save=()=>{try{localStorage.setItem('race_save',JSON.stringify({w:wallet,own,sel,mv,ctl,sky,sb:svBest,wx,dm,pg}))}catch(_){}};
let V,VM,cu,N,L,OB=[],CO=[],PD=[],RB=null,pos,X,v,lap,lapT,best,go,flash,bg,got,YW=0,RL=0,PT=0,run=false,started=false,last=0,NOW=0,mode=0,rd=0,cd=0,pfin=null,resDone=0,wAng=0,wDrag=0,wCx=0,wCy=0,wLast=0;
const K={l:0,r:0,g:0,b:0,h:0},MD={},STARS=Array.from({length:70},()=>[Math.random(),Math.random()*.9]);
const cr=i=>cu[(i%N+N)%N],fm=t=>(t/60|0)+':'+(t%60).toFixed(1).padStart(4,'0');
const ell=(x,y,rx,ry)=>{C.beginPath();C.ellipse(x,y,rx,ry,0,0,7);C.fill()};
const qd=(a,b,f,c,o=0)=>{C.fillStyle=c;C.beginPath();C.moveTo(a.x+a.w*(o-f),a.y);C.lineTo(a.x+a.w*(o+f),a.y);C.lineTo(b.x+b.w*(o+f),b.y);C.lineTo(b.x+b.w*(o-f),b.y);C.fill()};
const setVeh=id=>{sel=id;V=VEH[id];VM=MAXV*V.vmax/220;save()};

// трасса по фото: контрольные точки, сглаживание Catmull-Rom, равномерная длина, кривизна из поворотов
function trk(){
  const Q=[];for(let i=0;i<TP.length;i+=2)Q.push([TP[i],TP[i+1]]);
  const n=Q.length,S=[];
  for(let i=0;i<n;i++)for(let j=0;j<10;j++){
    const p0=Q[(i+n-1)%n],p1=Q[i],p2=Q[(i+1)%n],p3=Q[(i+2)%n],t=j/10,t2=t*t,t3=t2*t;
    S.push([0,1].map(k=>.5*(2*p1[k]+(p2[k]-p0[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(3*p1[k]-p0[k]-3*p2[k]+p3[k])*t3)));
  }
  const m=S.length,cl=[0];
  for(let i=1;i<=m;i++){const a=S[i-1],b=S[i%m];cl.push(cl[i-1]+Math.hypot(b[0]-a[0],b[1]-a[1]))}
  const Lt=cl[m],M=2400,R=[];let j=0;
  for(let k=0;k<M;k++){const s=Lt*k/M;while(cl[j+1]<s)j++;const a=S[j],b=S[(j+1)%m],f=(s-cl[j])/((cl[j+1]-cl[j])||1);R.push([a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f])}
  const th=R.map((_,k)=>{const a=R[(k+M-4)%M],b=R[(k+4)%M];return Math.atan2(b[1]-a[1],b[0]-a[0])});
  const dh=th.map((t,k)=>{let d=th[(k+1)%M]-t;while(d>Math.PI)d-=2*Math.PI;while(d<-Math.PI)d+=2*Math.PI;return d});
  const sm=dh.map((_,k)=>{let s=0;for(let q=-3;q<=3;q++)s+=dh[(k+q+M)%M];return s/7});
  const ab=sm.map(Math.abs).sort((a,b)=>a-b),qv=ab[Math.floor(M*.95)]||1e-3,K2=4/qv;
  cu=sm.map(x=>Math.max(-4.4,Math.min(4.4,x*K2)));
  N=M;L=N*SEG;
}
function gen(){
  trk();
  OB=[];for(let i=0;i<40;i++){const t=Math.random()*3|0;OB.push({z:12000+(i+.5)*(L-24000)/40+Math.random()*(L-24000)/120,x:Math.random()*1.5-.75,t,w:[.1,.15,.27][t],v:t==2?4200+Math.random()*1500:0,c:['#2f80ed','#f2c94c','#9b51e0','#27ae60'][i%4],hit:0})}
  CO=[];for(let i=0;i<20;i++)CO.push({z:(i+.5)*L/20+(Math.random()-.5)*L/40,x:(Math.random()-.5)*.8,t:3,w:.1,ph:Math.random()*6,hit:0});PD=[];for(let i=0;i<40;i++)PD.push({z:(i+.5)*L/40+(Math.random()-.5)*L/120,x:(Math.random()-.5)*1.3,t:4,w:.1,ph:Math.random()*6,sp:0,hit:0});
}

function bx(F,x0,x1,y0,y1,z0,z1,c){
  const P=[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];
  for(const f of[[0,1,2,3,0,0,-1],[5,4,7,6,0,0,1],[4,0,3,7,-1,0,0],[1,5,6,2,1,0,0],[3,2,6,7,0,1,0],[4,5,1,0,0,-1,0]])F.push({p:f.slice(0,4).map(i=>P[i]),n:f.slice(4),c});
}
const GL='#1a2736',DKc='#141414',TY='#1b1b1b',RM='#b9bec6';
function lof(F,S,cf,cap){
  const P=S.map(s=>{const w=s.w,a=s.a,b=s.b,t=s.t??w,k=Math.min(w,b-a)*(s.k??.32);return[[-w+k,a],[w-k,a],[w,a+k],[t,b-k],[t-k,b],[-t+k,b],[-t,b-k],[-w,a+k]].map(q=>[q[0],q[1],s.z])});
  for(let i=0;i<S.length-1;i++)for(let j=0;j<8;j++){
    const c=cf(i,j);if(!c)continue;
    const A=P[i][j],B2=P[i][(j+1)%8],D2=P[i+1][(j+1)%8],E=P[i+1][j],ym=(S[i].a+S[i].b+S[i+1].a+S[i+1].b)/4;
    const u=[B2[0]-A[0],B2[1]-A[1],B2[2]-A[2]],v2=[E[0]-A[0],E[1]-A[1],E[2]-A[2]];
    let n=[u[1]*v2[2]-u[2]*v2[1],u[2]*v2[0]-u[0]*v2[2],u[0]*v2[1]-u[1]*v2[0]];
    const l=Math.hypot(n[0],n[1],n[2])||1;n=[n[0]/l,n[1]/l,n[2]/l];
    if(n[0]*(A[0]+D2[0])+n[1]*(A[1]+D2[1]-2*ym)<0)n=[-n[0],-n[1],-n[2]];
    F.push({p:[A,B2,D2,E],n,c});
  }
  if(cap)F.push({p:P[0],n:[0,0,-1],c:cap});
}
function whl(F,x,r,z,w){
  const R=[];for(let k=0;k<8;k++){const a=(k+.5)*Math.PI/4;R.push([r+r*Math.sin(a),z+r*Math.cos(a)])}
  for(let k=0;k<8;k++){const A=R[k],B2=R[(k+1)%8],my=(A[0]+B2[0])/2-r,mz=(A[1]+B2[1])/2-z,l=Math.hypot(my,mz)||1;
    F.push({p:[[x-w/2,A[0],A[1]],[x+w/2,A[0],A[1]],[x+w/2,B2[0],B2[1]],[x-w/2,B2[0],B2[1]]],n:[0,my/l,mz/l],c:TY})}
  const s=x>=0?1:-1;
  F.push({p:R.map(q=>[x+s*w/2,q[0],q[1]]),n:[s,0,0],c:RM});
  F.push({p:R.map(q=>[x-s*w/2,q[0],q[1]]),n:[-s,0,0],c:TY});
}
function model(ty,c){
  const key=ty+c;if(MD[key])return MD[key];
  const F=[],bs=(a,b,y0,y1,z0,z1,cl)=>{bx(F,a,b,y0,y1,z0,z1,cl);bx(F,-b,-a,y0,y1,z0,z1,cl)};
  const sc=(z,w,a,b,t,k)=>({z,w,a,b,t,k}),bd=()=>c,cab=(i,j)=>i==1&&j>=3&&j<=5?c:GL,dk=()=>DKc;
  if(ty=='moto'){
    whl(F,0,.5,-1.15,.3);whl(F,0,.5,1.15,.24);
    lof(F,[sc(-.95,.2,.55,.95),sc(-.6,.26,.55,1),sc(.2,.28,.6,1.12),sc(.6,.22,.65,1.08)],bd,c);
    lof(F,[sc(-.95,.15,.98,1.05),sc(-.2,.22,1,1.12),sc(.15,.2,1.02,1.1)],()=>'#1b1b1b','#1b1b1b');
    bx(F,-.12,.12,.85,.98,-1.3,-1,'#c1121f');bx(F,-.17,.17,.5,.62,-1.45,-.9,c);
    lof(F,[sc(-.35,.3,1.05,1.7,.26),sc(-.1,.3,1.1,1.75,.24),sc(.25,.26,1.2,1.8,.2)],()=>'#222a35','#222a35');
    lof(F,[sc(-.28,.17,1.72,1.98,.14),sc(-.05,.2,1.72,2.04,.16),sc(.18,.17,1.74,1.96,.12)],()=>'#f3f3f3','#f3f3f3');
    bs(.28,.52,1.1,1.5,-.1,.45,'#222a35');bs(.24,.4,.55,1.15,-.25,.35,'#1d2430');bs(.24,.34,.35,.55,-1.2,-.6,'#c9ced6');
  }else if(ty=='f1'){
    whl(F,-1.15,.5,-1.5,.55);whl(F,1.15,.5,-1.5,.55);whl(F,-1.1,.46,1.35,.5);whl(F,1.1,.46,1.35,.5);
    lof(F,[sc(-1.9,.3,.4,.95,.2),sc(-1.2,.42,.3,1.05,.3),sc(-.2,.4,.28,.9,.3),sc(.8,.3,.28,.62,.22),sc(1.8,.2,.28,.46,.16)],bd,c);
    lof(F,[sc(-1.6,.2,.95,1.2,.1),sc(-1.1,.3,.95,1.5,.14),sc(-.5,.28,.95,1.15,.14)],bd,c);
    lof(F,[sc(-.35,.17,.95,1.2,.15),sc(-.1,.2,.95,1.3,.17),sc(.15,.17,.95,1.15,.14)],()=>'#f2f2f2','#f2f2f2');
    bx(F,-1,1,1.3,1.38,-2.35,-1.95,c);bx(F,-1,1,.95,1,-2.3,-1.95,DKc);bs(.95,1.05,.55,1.45,-2.38,-1.9,DKc);
    bx(F,-.12,.12,1,1.3,-2.3,-2.2,'#c1121f');bx(F,-1,1,.28,.4,1.7,2.3,c);bs(.9,1,.2,.5,1.6,2.3,DKc);
    bx(F,-.22,.22,.9,1.05,-.3,.3,DKc);bx(F,-.7,.7,.2,.3,-2,-.5,DKc);
  }else if(ty=='pors'||ty=='ferr'||ty=='lamb'){
    const lb=ty=='lamb',rr=lb?.43:.41,wr=lb?.36:.3,k=lb?.2:undefined;
    whl(F,-.92,rr,-1.3,wr);whl(F,.92,rr,-1.3,wr);whl(F,-.9,rr-.02,1.3,wr-.03);whl(F,.9,rr-.02,1.3,wr-.03);
    if(lb){

  for(const o of OB.concat(CO,wx?PD:[])){if(o.hit>0)continue;const rel=((o.z-cp)%L+L)%L,n=Math.floor((rel+fr)/SEG);if(n>=5&&n<D)B[n].push([o,(rel+fr-n*SEG)/SEG])}
  for(let n=D-1;n>=0;n--){

  const hc=night?'42,63,102':'255,226,190',hz=C.createLinearGradient(0,hy-1,0,hy+H*.07);hz.addColorStop(0,`rgba(${hc},1)`);hz.addColorStop(1,`rgba(${hc},0)`);

  const sp=Math.abs(v)/VM,sk=Math.abs(X)>1?sp*(Math.random()-.5)*8:0;
  car(W/2+sk,yc+sk*.5,1.05*S,sel,V.c,YW,RL,PT);
  if(spl>0){const u=1-spl/.8;C.fillStyle='rgba(225,240,255,'+(.9*spl/.8)+')';for(let i=0;i<24;i++){const a=(i*2.399)%1,sd=i%2?1:-1,dx=sd*wc*(.25+.9*u*(.4+a)),dy=-Math.sin(Math.min(1,u*(1.3+a*.5))*Math.PI)*wc*(.3+a*.7);C.beginPath();C.arc(W/2+dx,yc+dy-wc*.1,wc*(.025+.02*a),0,7);C.fill()}}
  if((K.h||dm&&Math.abs(lvx)>1.3)&&sp>.2)for(let i=0;i<6;i++){C.fillStyle='rgba(235,235,235,'+(.15+Math.random()*.25)+')';C.beginPath();C.arc(W/2+(i%2?1:-1)*wc*.26+(Math.random()-.5)*wc*.2,yc-Math.random()*wc*.12,wc*(.05+Math.random()*.08),0,7);C.fill()}

function upd(dt){
  if(cd>0){cd-=dt;if(cd<=0){cd=0;go=1}return}
  const sp=Math.abs(v)/VM,c=cr(pos/SEG|0),ac=VM/4.5*V.acc,gn=3.2*V.steer*(1.2-.4*sp);
  if(!wDrag)wAng*=Math.max(0,1-dt*3);
  const st=Math.max(-1,Math.min(1,K.r-K.l+ctl*Math.max(-1,Math.min(1,wAng/(Math.PI*.75)))));
  if(K.g)v+=ac*dt*(v<0?3:1);else if(!K.b)v-=Math.sign(v)*Math.min(Math.abs(v),VM/7*dt);
  if(K.b)v-=(v>30?VM/1.3:ac*.5)*dt;
  if(K.h&&v>0)v-=VM/1.3*.4*dt;
  if(Math.abs(X)>1&&v>VM*.3)v-=VM/1.3*.6*dt;
  v*=1-dt*Math.abs(c)*sp*.035;
  v=Math.max(-VM*.2,Math.min(VM,v));
  const tg=st*(gn+K.h*1.6)*(dm?1.8:1)*Math.min(1,sp*3);
  lvx+=(tg-lvx)*Math.min(1,dt*(dm?(K.h?1.6:2.4):14));
  X+=lvx*dt-dt*c*sp*sp*(dm?.55:.4)*(K.h?1.5:1);
  if(dm&&sp>.2)v*=1-dt*Math.abs(lvx)*.05;
  if(Math.abs(X)>1.6){X=Math.sign(X)*1.6;v*=1-dt*2}
  pos+=v*dt;
  if(v>1)go=1;
  if(go)lapT+=dt;
  if(pos>=L){if(mode==3&&run)lvlDone();if(mode==1&&pfin==null)pfin=lapT;pos-=L;lap++;best=Math.min(best,lapT);lapT=0;got=0;CO.forEach(q=>q.hit=0)}
  if(pos<0){pos=0;v=Math.max(v,0)}
  bg+=c*sp*dt*W*.12*Math.sign(v||1);
  if(mode==2&&sp*V.vmax>=10){sv+=dt;const mn=Math.floor(sv/60);if(mn>svPaid){svPaid=mn;wallet+=10;svCoins+=10;save();beep()}}
  if(mode==1&&RB.fin==null)botUpd(dt);
  for(const o of OB){
    if(o.bot){
      if(RB.fin==null){let dz=RB.z-pos;if(dz>L/2)dz-=L;if(dz<-L/2)dz+=L;if(Math.abs(dz)<70&&Math.abs(RB.x-X)<.25){const s=Math.sign(X-RB.x)||1;X+=s*dt*3;RB.x-=s*dt*3;v*=1-dt*2}}
      continue;
    }
    if(o.hit>0){o.hit-=dt;continue}
    if(o.v){o.z+=o.v*dt;if(o.z>L-6000)o.hit=1e9}
    let dz=o.z-pos;if(dz>L/2)dz-=L;if(dz<-L/2)dz+=L;
    if(Math.abs(dz)<140&&Math.abs(o.x-X)<.27+o.w){if(mode==2){if(run)crashSurv();return}o.hit=3;flash=.3;X+=Math.sign(X-o.x||1)*.12;v=o.v?Math.min(v,o.v*.5):v*.3}
  }
  if(mode==1&&pfin!=null&&RB.fin!=null&&!resDone){resDone=1;finish()}
  for(const q of CO){
    if(q.hit>0)continue;
    let dz=q.z-pos;if(dz>L/2)dz-=L;if(dz<-L/2)dz+=L;
    if(Math.abs(dz)<170&&Math.abs(q.x-X)<.4){q.hit=1e9;got++;wallet++;save();beep()}
  }
  for(const q of PD){if(q.sp>0)q.sp=Math.max(0,q.sp-dt);let dz=q.z-pos;if(dz>L/2)dz-=L;if(dz<-L/2)dz+=L;if(wx&&q.sp<=0&&dz<=70&&dz>=-70-Math.abs(v)*dt&&Math.abs(q.x-X)<.34){q.sp=.5;spl=.8;v*=.985;if(AC&&mg)noise(AC.currentTime,'highpass',2500,.25,.25)}}
  if(wx==2){lz-=dt;if(lz<=0){lz=7+Math.random()*9;mkBolt();lf=.5;if(AC&&mg)noise(AC.currentTime,'lowpass',500,.3,1.4)}}
  lf=Math.max(0,lf-dt*2.5);
  bolts.forEach(b=>b.l-=dt);bolts=bolts.filter(b=>b.l>0);
  for(const r of RD){r.y+=r.v*dt;r.x+=wind*dt;if(r.y>H){r.y=-r.len;r.x=Math.random()*W}}
  flash=Math.max(0,flash-dt);spl=Math.max(0,spl-dt);
  const k=Math.min(1,sp*2);
  YW+=((st*.16+K.h*st*.1+c*.02)*k*1.4+(dm?(st*.3+lvx*.07)*k:0)-YW)*Math.min(1,dt*9);
  RL+=((st*.06+c*.02)*k*V.roll*1.4-RL)*Math.min(1,dt*9);
  PT+=((K.g?-.03:K.b?.05:0)-PT)*Math.min(1,dt*6);
}

function botUpd(dt){
  const b=RB,d=DIFF[rd],BM=MAXV*d.vm,sp=b.v/BM,i0=Math.floor(b.dist/SEG),c=cr(i0);
  let cA=0;const nn=Math.ceil(b.v*d.lt/SEG)+2;
  for(let i=0;i<=nn;i++)cA=Math.max(cA,Math.abs(cr(i0+i)));
  const tsp=Math.min(1,Math.sqrt(d.A/Math.max(.05,cA)))*d.sk,k=Math.max(.2,Math.min(1,sp*3)),gn=3.2*(1.2-.4*sp)*k;
  let tx=Math.sin(b.dist*.0009+rd)*d.nz;
  for(const o of OB){if(o.bot)continue;let dz=o.z-b.z;if(dz>L/2)dz-=L;if(dz<-L/2)dz+=L;if(dz>0&&dz<700&&Math.abs(o.x-b.x)<.35)tx+=b.x>o.x?.5:-.5}
  const st=Math.max(-1,Math.min(1,c*sp*sp*.4/gn+(tx-b.x)*2.5));
  b.x+=st*dt*gn-dt*c*sp*sp*.4;
  if(Math.abs(b.x)>1.6)b.x=Math.sign(b.x)*1.6;
  if(sp<tsp)b.v+=BM/4.5*dt;else if(sp>tsp*1.04)b.v-=BM/1.3*dt;else b.v-=BM/7*dt;
  b.v*=1-dt*Math.abs(c)*sp*.035;
  if(Math.abs(b.x)>1&&b.v>BM*.3)b.v-=BM/1.3*.6*dt;
  b.v=Math.max(0,Math.min(BM,b.v));
  b.dist+=b.v*dt;b.tm+=dt;b.z=b.dist%L;
  if(b.dist>=L)b.fin=b.tm;
}

function puddle(x,y,w,o){const rx=w*.26,ry=w*.07,s=.5+.5*Math.abs(Math.sin(NOW*2+o.ph));C.fillStyle='rgba(80,120,160,.55)';C.beginPath();C.ellipse(x,y,rx,ry,0,0,7);C.fill();C.strokeStyle='rgba(220,240,255,.7)';C.lineWidth=Math.max(1,w*.02);C.beginPath();C.ellipse(x,y,rx*s,ry*s,0,0,7);C.stroke();C.fillStyle='rgba(235,245,255,.9)';for(let i=0;i<3;i++){const t=(NOW*1.6+o.ph+i*.7)%1,dx=Math.cos(o.ph+i*2.1)*rx*.8,dy=-Math.sin(t*Math.PI)*w*.2;C.fillRect(x+dx-w*.012,y+dy-w*.012,w*.024,w*.024)}if(o.sp>0){const t=1-o.sp/.7;C.fillStyle='rgba(240,250,255,.95)';for(let i=0;i<8;i++){const a=i*Math.PI/4,r=rx*(.3+t*1.2),hh=Math.sin(t*Math.PI)*w*.35;C.fillRect(x+Math.cos(a)*r-w*.015,y+Math.sin(a)*ry*2-hh-w*.015,w*.03,w*.03)}}}
function mb(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function genLv(ch,l){
  const R=mb(ch*1000+l*77+5),sec=[[14,0]];let dir=R()<.5?-1:1,tot=140;const tg=1100+l*35;
  while(tot<tg){const r=R();let n,c;
    if(r<.28){n=5+(R()*8|0);c=0}
    else{if(R()<.65)dir=-dir;const q=R(),hd=.3+l/60;
      if(q<hd){n=3+(R()*4|0);c=dir*(3.4+R()*.9)}else if(q<hd+.35){n=6+(R()*6|0);c=dir*(2.4+R()*.8)}else{n=9+(R()*8|0);c=dir*(1.6+R()*.7)}}
    sec.push([n,c]);tot+=n*10}
  cu=[];for(const[n,c]of sec){const m=n*10;for(let j=0;j<m;j++)cu.push(c*Math.min(1,j/(m*.25),(m-1-j)/(m*.25)))}
  N=cu.length;L=N*SEG;
  const no=Math.min(70,22+l*2);
  OB=[];for(let i=0;i<no;i++){const t=R()*3|0;OB.push({z:12000+(i+.5)*(L-24000)/no+R()*(L-24000)/(no*3),x:R()*1.5-.75,t,w:[.1,.15,.27][t],v:t==2?4200+R()*1500:0,c:['#2f80ed','#f2c94c','#9b51e0','#27ae60'][i%4],hit:0})}
  CO=[];for(let i=0;i<20;i++)CO.push({z:(i+.5)*L/20+(R()-.5)*L/40,x:(R()-.5)*.8,t:3,w:.1,ph:R()*6,hit:0});
  PD=[];for(let i=0;i<40;i++)PD.push({z:(i+.5)*L/40+(R()-.5)*L/120,x:(R()-.5)*1.3,t:4,w:.1,ph:R()*6,sp:0,hit:0});
}

function beach(a,sd,s){
  const h=Math.imul(s+7,2654435761)>>>0,r1=(h%97)/97,r2=((h>>>8)%89)/89,k=(s/3|0)%3,w=a.w,x=a.x+sd*w*(1.75+r1*1.5),y=a.y;
  const cols=['#e74c3c','#3498db','#f1c40f','#2ecc71','#ff7f50','#9b59b6'];
  if(k==0){
    const hh=w*1.3,tx=x-sd*w*.1*(1+r2),ty=y-hh;
    C.strokeStyle='#7a5230';C.lineWidth=Math.max(1,w*.1);C.lineCap='round';C.beginPath();C.moveTo(x,y);C.quadraticCurveTo(x+sd*w*.16,y-hh*.55,tx,ty);C.stroke();
    C.fillStyle='#2a8a3c';
    for(let i=0;i<6;i++){C.save();C.translate(tx,ty);C.rotate(-1.57+(i-2.5)*.62);C.beginPath();C.ellipse(w*.3,0,w*.33,w*.07,0,0,7);C.fill();C.restore()}
    C.fillStyle='#5b3a1e';C.beginPath();C.arc(tx-w*.05,ty+w*.06,w*.05,0,7);C.fill();C.beginPath();C.arc(tx+w*.05,ty+w*.07,w*.05,0,7);C.fill();
  }else{
    const uh=w*(.62+r2*.15),cw=w*.36,col=cols[(s+k)%6];
    C.strokeStyle='#999';C.lineWidth=Math.max(1,w*.03);C.beginPath();C.moveTo(x,y);C.lineTo(x,y-uh);C.stroke();
    if(k==1){
      C.fillStyle=cols[(s+3)%6];C.fillRect(x-w*.34,y-w*.04,w*.68,w*.04);
      C.fillStyle=['#f1c27d','#8d5524','#e0ac69'][s%3];C.beginPath();C.ellipse(x+w*.05,y-w*.08,w*.2,w*.05,0,0,7);C.fill();C.beginPath();C.arc(x-w*.22,y-w*.09,w*.05,0,7);C.fill();
    }else{person(x-w*.12,y,w*.045,cols[(s+1)%6],s);person(x+w*.12,y,w*.045,cols[(s+4)%6],s+1)}
    C.fillStyle=col;C.beginPath();C.moveTo(x-cw,y-uh);C.quadraticCurveTo(x,y-uh-cw*1.3,x+cw,y-uh);C.closePath();C.fill();

  }
}

const WC=$('wl'),WX=WC.getContext('2d');
function drawWheel(){
  WX.setTransform(1,0,0,1,0,0);WX.clearRect(0,0,300,300);WX.translate(150,150);WX.rotate(wAng);
  WX.lineWidth=26;WX.strokeStyle='#1d1d1d';WX.beginPath();WX.arc(0,0,118,0,7);WX.stroke();
  WX.lineWidth=12;WX.strokeStyle='#bbb';WX.beginPath();WX.moveTo(-108,0);WX.lineTo(108,0);WX.moveTo(0,0);WX.lineTo(0,108);WX.stroke();
  WX.fillStyle='#ff5a36';WX.beginPath();WX.arc(0,0,30,0,7);WX.fill();
}
WC.addEventListener('pointerdown',e=>{const r=WC.getBoundingClientRect();wCx=r.left+r.width/2;wCy=r.top+r.height/2;wLast=Math.atan2(e.clientY-wCy,e.clientX-wCx);wDrag=1;WC.setPointerCapture(e.pointerId);e.preventDefault()});
WC.addEventListener('pointermove',e=>{if(!wDrag)return;const a=Math.atan2(e.clientY-wCy,e.clientX-wCx);let d=a-wLast;if(d>Math.PI)d-=2*Math.PI;if(d<-Math.PI)d+=2*Math.PI;wAng=Math.max(-2.4,Math.min(2.4,wAng+d));wLast=a});
const wUp=()=>{wDrag=0};WC.addEventListener('pointerup',wUp);WC.addEventListener('pointercancel',wUp);

function loop(ms){
  const t=ms/1000,dt=run?Math.min(.05,(ms-last)/1e3||0):0;last=ms;NOW=t;
  upd(dt);
  if(run||paused)draw();else bgMenu(t);
  hud();
  if(ctl&&run)drawWheel();
  if(!$('shop').classList.contains('hide'))drawPV(t);
  requestAnimationFrame(loop);
}

const map={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',ArrowUp:'g',KeyW:'g',ArrowDown:'b',KeyS:'b',Space:'h',ShiftLeft:'h'};
addEventListener('keydown',e=>{if(e.code==='Escape'&&run)$('pause').click();const k=map[e.code];if(k){K[k]=1;e.preventDefault()}});
addEventListener('keyup',e=>{const k=map[e.code];if(k)K[k]=0});
addEventListener('blur',()=>{for(const k in K)K[k]=0});
addEventListener('contextmenu',e=>e.preventDefault());
document.querySelectorAll('[data-k]').forEach(btn=>{
  const k=btn.dataset.k,on=e=>{e.preventDefault();K[k]=1;btn.classList.add('on')},off=()=>{K[k]=0;btn.classList.remove('on')};
  btn.addEventListener('pointerdown',on);
  ['pointerup','pointercancel','pointerleave'].forEach(t=>btn.addEventListener(t,off));
});

let AC,mg,bf,ld,dl,nb,nt=0,si=0,tmr;
const SX=60/118/4,PR=[[45,48,52],[41,45,48],[48,52,55],[43,47,50]],mtof=m=>440*2**((m-69)/12);
function tone(ty,f,t,d,vol,to){const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(to);o.start(t);o.stop(t+d+.05)}
function noise(t,ft,fq,vol,d){const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=nb;f.type=ft;f.frequency.value=fq;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.connect(f);f.connect(g);g.connect(mg);s.start(t,Math.random()*.5);s.stop(t+d+.05)}
function kick(t){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(38,t+.12);g.gain.setValueAtTime(.9,t);g.gain.exponentialRampToValueAtTime(.001,t+.22);o.connect(g);g.connect(mg);o.start(t);o.stop(t+.25)}
function note(s,t){
  const ch=PR[s>>4&3],st=s&15;
  if(st%2==0){tone('sawtooth',mtof(ch[0]+((st>>1)%2?12:0)),t,SX*1.7,.2,bf);tone('square',mtof(ch[(st>>1)%3]+24),t,SX*1.2,.04,ld)}
  if(st%4==0)kick(t);
  if(st%4==2)noise(t,'highpass',7000,.1,.04);
  if(st==4||st==12)noise(t,'bandpass',1800,.3,.14);
}
function sched(){while(nt<AC.currentTime+.15){note(si,nt);nt+=SX;si=(si+1)%64}}
function startMusic(){
  if(!AC){
    AC=new(window.AudioContext||window.webkitAudioContext)();
    mg=AC.createGain();mg.connect(AC.destination);mg.gain.value=mv/100*.6;
    bf=AC.createBiquadFilter();bf.type='lowpass';bf.frequency.value=700;bf.connect(mg);
    ld=AC.createGain();ld.connect(mg);
    dl=AC.createDelay();dl.delayTime.value=SX*3;const fb=AC.createGain();fb.gain.value=.35;
    ld.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(mg);
    nb=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }
  AC.resume();nt=AC.currentTime+.1;clearInterval(tmr);tmr=setInterval(sched,25);
}
function beep(){if(AC&&mg)tone('sine',1320,AC.currentTime,.15,.2,mg)}

$('mv').value=mv;$('mvv').textContent=mv+'%';
$('mv').oninput=e=>{mv=+e.target.value;$('mvv').textContent=mv+'%';if(mg)mg.gain.value=mv/100*.6;save()};
$('ctl').onclick=()=>{ctl^=1;applyCtl();save()};
$('skb').onclick=()=>{sky=sky=='night'?'morn':'night';applyCtl();save()};
$('wxb').onclick=()=>{wx=(wx+1)%3;RD=[];applyCtl();save()};
$('dmb').onclick=()=>{dm^=1;applyCtl();save()};
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{panel(b.dataset.p);if(b.dataset.p=='shop')renderShop();if(b.dataset.p=='chp')renderChp()});
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>startRace(+b.dataset.d));
$('again').onclick=()=>mode==2?startSurv():mode==3?startLevel(cCh,cLv):startRace(rd);
$('play').onclick=()=>{started=true;mode=0;newRace();run=true;panel('mm');sync();startMusic()};
$('surv').onclick=()=>startSurv();
document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>openLv(+b.dataset.ch));
$('lvg').onclick=e=>{const b=e.target.closest('button');if(b&&!b.disabled)startLevel(cCh,+b.dataset.l)};
$('nxt').onclick=()=>startLevel(cCh,cLv+1);
$('cont').onclick=()=>{run=true;paused=false;sync();startMusic()};
$('pause').onclick=()=>{run=false;paused=true;$('cont').classList.remove('hide');panel('mm');sync();save()};
$('shopList').onclick=e=>{
  const b=e.target.closest('button');if(!b||b.disabled)return;
  const id=b.dataset.i;
  if(b.dataset.a=='buy'){const p=VEH[id].price;if(wallet>=p){wallet-=p;own[id]=1;setVeh(id)}}
  else setVeh(id);
  save();renderShop();
};
setVeh(sel);newRace();sync();requestAnimationFrame(loop);
</script>
